// Maritime Pack - compatibility fixes that need ModuleManager (not bundled).
// Every patch only acts when MPUtils is installed.

// MPUtils/Resources.cfg defines "Water" (flowMode STAGE_PRIORITY_FLOW), which Community Resource Pack
// already defines (flowMode ALL_VESSEL). KSP keeps the first definition and logs an error for the
// duplicate. When CRP is installed, remove the MPUtils copy so only CRP's definition exists.
// Nothing changes without CRP.
!RESOURCE_DEFINITION[Water]:HAS[#flowMode[STAGE_PRIORITY_FLOW]]:NEEDS[MPUtils&CommunityResourcePack]:AFTER[MPUtils]
{
}
